<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Weeping Willow — Quests</title>
<style>
  html, body { margin:0; padding:0; background:#0e1a12; height:100%; }
  #status { position:fixed; top:10px; left:10px; color:#cbd9c9; font-family: system-ui, sans-serif; font-size:13px; opacity:0.8; }
  svg { display:block; width:100%; height:100vh; }
</style>
</head>
<body>
<div id="status">Loading…</div>
<svg id="tree" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet"></svg>
<script>
const REFRESH_MS = 30000;
const LEAF_COLORS = { "New leaf": "#B9F6CA", "Growing": "#2ECC71", "Grown": "#B39DDB" };
const BRANCH_COLORS = { alive: "#8fae7e", needs_watering: "#a68a5f" };

function hashSeed(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h; }
function seededRand(seed){ let t=seed+=0x6D2B79F5; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }
function pointOnCubic(p0,p1,p2,p3,t){ const mt=1-t; return { x: mt*mt*mt*p0.x+3*mt*mt*t*p1.x+3*mt*t*t*p2.x+t*t*t*p3.x, y: mt*mt*mt*p0.y+3*mt*mt*t*p1.y+3*mt*t*t*p2.y+t*t*t*p3.y }; }
function svgEl(tag, attrs){ const el=document.createElementNS("http://www.w3.org/2000/svg", tag); for(const k in attrs) el.setAttribute(k, attrs[k]); return el; }

function render(data){
  const svg = document.getElementById("tree");
  svg.innerHTML = "";

  svg.appendChild(svgEl("line",{x1:0,y1:660,x2:1000,y2:660,stroke:"#2b3a2b","stroke-width":2}));

  svg.appendChild(svgEl("path",{d:"M 500,660 C 470,520 530,320 500,120",stroke:"#5c4a3a","stroke-width":18,fill:"none","stroke-linecap":"round"}));
  svg.appendChild(svgEl("path",{d:"M 500,660 C 470,520 530,320 500,120",stroke:"#4a3a2c","stroke-width":6,fill:"none","stroke-linecap":"round",opacity:0.5}));

  const branches = data.branches || [];
  const n = Math.max(branches.length, 1);
  const spread = Math.min(420, 90 * n);

  branches.forEach((branch, i) => {
    const seed = hashSeed(branch.id);
    const rand = (o) => seededRand(seed + o);

    const frac = n === 1 ? 0.5 : i/(n-1);
    const side = i % 2 === 0 ? 1 : -1;
    const p0 = { x: 500, y: 140 + frac*120 };
    const reach = 140 + rand(3)*160;
    const p3 = { x: 500 + side*(spread*0.3 + reach*0.4), y: 380 + rand(1)*220 };
    const c1 = { x: p0.x + side*reach*0.5, y: p0.y + 40 + rand(4)*40 };
    const c2 = { x: p3.x - side*40, y: p3.y - 100 - rand(5)*60 };

    const color = BRANCH_COLORS[branch.health] || BRANCH_COLORS.alive;
    const path = svgEl("path",{d:`M ${p0.x},${p0.y} C ${c1.x},${c1.y} ${c2.x},${c2.y} ${p3.x},${p3.y}`,stroke:color,"stroke-width":5,fill:"none","stroke-linecap":"round",opacity:0.85});
    const title = svgEl("title",{}); title.textContent = branch.name + " — " + (branch.health === "alive" ? "Alive" : "Needs watering");
    path.appendChild(title); svg.appendChild(path);

    const quests = branch.quests || [];
    const m = Math.max(quests.length, 1);
    quests.forEach((quest, j) => {
      const t = 0.3 + 0.6 * ((j+1)/(m+1));
      const base = pointOnCubic(p0,c1,c2,p3,t);
      const qseed = hashSeed(quest.id);
      const qrand = (o) => seededRand(qseed+o);
      const tEndX = base.x + (qrand(1)-0.5)*100 + side*20;
      const tEndY = base.y + 70 + qrand(2)*90;
      const tc1 = { x: base.x+(tEndX-base.x)*0.3, y: base.y+25 };
      const tc2 = { x: base.x+(tEndX-base.x)*0.7, y: tEndY-25 };

      svg.appendChild(svgEl("path",{d:`M ${base.x},${base.y} C ${tc1.x},${tc1.y} ${tc2.x},${tc2.y} ${tEndX},${tEndY}`,stroke:color,"stroke-width":2,fill:"none",opacity:0.7}));

      const steps = quest.steps || [];
      if (steps.length === 0){
        const leafColor = LEAF_COLORS[quest.leafStage] || "#88a888";
        const leaf = svgEl("circle",{cx:tEndX,cy:tEndY,r:7,fill:leafColor,stroke:"#1e2b1e","stroke-width":0.5});
        const t2 = svgEl("title",{}); t2.textContent = quest.name + " — " + (quest.leafStage || "no stage");
        leaf.appendChild(t2); svg.appendChild(leaf);
      } else {
        steps.forEach((step, k) => {
          const lseed = hashSeed(step.id + k);
          const lrand = (o) => seededRand(lseed+o);
          const angle = lrand(1) * Math.PI * 2;
          const dist = 8 + lrand(2)*22;
          const lx = tEndX + Math.cos(angle)*dist;
          const ly = tEndY + Math.sin(angle)*dist*0.6 + 6;
          const leafColor = LEAF_COLORS[step.leafStage] || "#88a888";
          const leaf = svgEl("ellipse",{cx:lx,cy:ly,rx:6,ry:8,fill:leafColor,stroke:"#1e2b1e","stroke-width":0.5,transform:"rotate(" + (lrand(3)*40-20) + " " + lx + " " + ly + ")"});
          const t3 = svgEl("title",{}); t3.textContent = step.name + " — " + (step.leafStage || "no stage");
          leaf.appendChild(t3); svg.appendChild(leaf);
        });
      }
    });
  });
}

async function refresh(){
  const statusEl = document.getElementById("status");
  try {
    const res = await fetch("/api/notion", { cache: "no-store" });
    const data = await res.json();
    if (data.error){ statusEl.textContent = "Error: " + data.error; return; }
    render(data);
    statusEl.textContent = "Last updated: " + new Date(data.generatedAt).toLocaleTimeString();
  } catch(e){ statusEl.textContent = "Error fetching data: " + e.message; }
}
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
