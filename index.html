<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Weeping Willow — Quests</title>
<style>
  html, body { margin:0; padding:0; background:#feeac7; height:100%; }
  #status { position:fixed; top:10px; left:10px; color:#4a3527; font-family: system-ui, sans-serif; font-size:13px; opacity:0.8; }
  svg { display:block; width:100%; height:100vh; }
</style>
</head>
<body>
<div id="status">Loading…</div>
<svg id="tree" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet"></svg>
<script>
const REFRESH_MS = 30000;
const LEAF_COLORS = { "New leaf": "#dde5b6", "Growing": "#adc178", "Grown": "#B39DDB" };
const BRANCH_COLORS = { alive: "#adc178", needs_watering: "#8a7458" };

function hashSeed(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h; }
function seededRand(seed){ let t=seed+=0x6D2B79F5; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }
function pointOnCubic(p0,p1,p2,p3,t){ const mt=1-t; return { x: mt*mt*mt*p0.x+3*mt*mt*t*p1.x+3*mt*t*t*p2.x+t*t*t*p3.x, y: mt*mt*mt*p0.y+3*mt*mt*t*p1.y+3*mt*t*t*p2.y+t*t*t*p3.y }; }
function tangentOnCubic(p0,p1,p2,p3,t){ const mt=1-t; const dx=3*mt*mt*(p1.x-p0.x)+6*mt*t*(p2.x-p1.x)+3*t*t*(p3.x-p2.x); const dy=3*mt*mt*(p1.y-p0.y)+6*mt*t*(p2.y-p1.y)+3*t*t*(p3.y-p2.y); return Math.atan2(dy,dx)*180/Math.PI; }
function svgEl(tag, attrs){ const el=document.createElementNS("http://www.w3.org/2000/svg", tag); for(const k in attrs) el.setAttribute(k, attrs[k]); return el; }

function render(data){
  const svg = document.getElementById("tree");
  svg.innerHTML = "";

  const trunkTop = { x: 500, y: 330 };
  const trunkPath = `
    M 445,720
    C 440,650 458,600 468,540
    C 478,470 485,400 493,340
    C 496,336 500,332 ${trunkTop.x},${trunkTop.y}
    C ${trunkTop.x+8},332 ${trunkTop.x+14},336 512,340
    C 520,400 528,470 538,540
    C 548,600 566,650 560,720
    Z
  `;
  svg.appendChild(svgEl("path",{d:trunkPath, fill:"#4a3527", stroke:"none"}));
    
  const branches = data.branches || [];
  const n = Math.max(branches.length, 1);

  branches.forEach((branch, i) => {
    const seed = hashSeed(branch.id);
    const rand = (o) => seededRand(seed + o);

    const frac = n === 1 ? 0.5 : i/(n-1);
    const side = frac < 0.5 ? -1 : 1;
    const spreadX = (frac - 0.5) * 2;
    const archPeakX = 500 + spreadX * (260 + rand(1)*100);
    const archPeakY = 90 + rand(2)*70;
    const archEndX = 500 + spreadX * (380 + rand(3)*140);
    const archEndY = 220 + rand(4)*90;

    const p0 = trunkTop;
    const c1 = { x: trunkTop.x + spreadX*80, y: trunkTop.y - 120 - rand(5)*40 };
    const c2 = { x: archPeakX - spreadX*60, y: archPeakY - 10 };
    const peak = { x: archPeakX, y: archPeakY };

    const c3 = { x: archPeakX + spreadX*60, y: archPeakY + 40 };
    const c4 = { x: archEndX - spreadX*30, y: archEndY - 60 };
    const end = { x: archEndX, y: archEndY };

    const color = BRANCH_COLORS[branch.health] || BRANCH_COLORS.alive;

    const armPath = `M ${p0.x},${p0.y} C ${c1.x},${c1.y} ${c2.x},${c2.y} ${peak.x},${peak.y} C ${c3.x},${c3.y} ${c4.x},${c4.y} ${end.x},${end.y}`;
    const path = svgEl("path",{d:armPath,stroke:color,"stroke-width":9,fill:"none","stroke-linecap":"round",opacity:0.95});
    const title = svgEl("title",{}); title.textContent = branch.name + " — " + (branch.health === "alive" ? "Alive" : "Needs watering");
    path.appendChild(title); svg.appendChild(path);

    const quests = branch.quests || [];
    const m = Math.max(quests.length, 1);

    quests.forEach((quest, j) => {
      const t = 0.15 + 0.8 * ((j+1)/(m+1));
      let base, tangentAngle;
      if (t <= 1){
        base = pointOnCubic(p0,c1,c2,peak,t);
        tangentAngle = tangentOnCubic(p0,c1,c2,peak,t);
      }
      const t2 = 0.2 + 0.75 * ((j+1)/(m+1));
      base = pointOnCubic(peak,c3,c4,end,t2);

      const qseed = hashSeed(quest.id);
      const qrand = (o) => seededRand(qseed+o);
      const strandLen = 160 + qrand(1)*220;
      const sway = (qrand(2)-0.5) * 40;
      const strandEndX = base.x + sway;
      const strandEndY = base.y + strandLen;
      const sc1 = { x: base.x + sway*0.3, y: base.y + strandLen*0.35 };
      const sc2 = { x: strandEndX - sway*0.3, y: strandEndY - strandLen*0.25 };

      const strandPath = `M ${base.x},${base.y} C ${sc1.x},${sc1.y} ${sc2.x},${sc2.y} ${strandEndX},${strandEndY}`;
      svg.appendChild(svgEl("path",{d:strandPath,stroke:color,"stroke-width":1.5,fill:"none",opacity:0.55}));

      const steps = quest.steps || [];
      const leafCount = steps.length > 0 ? steps.length : 1;
      const leavesData = steps.length > 0 ? steps : [{ id: quest.id, name: quest.name, leafStage: quest.leafStage }];

      leavesData.forEach((leafItem, k) => {
        const lt = (k+1) / (leafCount+1);
        const lp = pointOnCubic(base, sc1, sc2, {x:strandEndX,y:strandEndY}, lt);
        const lseed = hashSeed(leafItem.id + k);
        const lrand = (o) => seededRand(lseed+o);
        const jitter = (lrand(1)-0.5) * 14;
        const angle = (lrand(4)-0.5) * 30;
        const leafColor = LEAF_COLORS[leafItem.leafStage] || "#88a888";
        const lx = lp.x + jitter, ly = lp.y;
        const leafLen = 20, leafWid = 4.5;
        const leafPath = `M ${lx},${ly-leafLen*0.6} Q ${lx+leafWid},${ly-leafLen*0.1} ${lx},${ly+leafLen*0.4} Q ${lx-leafWid},${ly-leafLen*0.1} ${lx},${ly-leafLen*0.6} Z`;
        const leaf = svgEl("path",{
          d: leafPath,
          fill:leafColor, stroke:"#1e2b1e","stroke-width":0.4,
          transform:`rotate(${angle} ${lx} ${ly})`
});
        const t3 = svgEl("title",{}); t3.textContent = leafItem.name + " — " + (leafItem.leafStage || "no stage");
        leaf.appendChild(t3); svg.appendChild(leaf);
      });
    });
  });
}

async function refresh(){
  const statusEl = document.getElementById("status");
  try {
    const res = await fetch("/api/notion", { cache: "no-store" });
    const data = await res.json();
    if (data.error){ statusEl.textContent = "Error: " + data.error; return; }
    render(data);
    statusEl.textContent = "Last updated: " + new Date(data.generatedAt).toLocaleTimeString();
  } catch(e){ statusEl.textContent = "Error fetching data: " + e.message; }
}
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
